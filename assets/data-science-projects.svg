<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsTitle dsDesc">
  <title id="dsTitle">Data Science Projects</title>
  <desc id="dsDesc">Stylized data visualization graphic representing a data science project portfolio</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1720"/>
      <stop offset="100%" stop-color="#1a2530"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#f2c572"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#7ee8db"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>
  <rect width="800" height="300" fill="url(#grid)"/>

  <!-- Bar chart silhouette (bottom left) -->
  <g opacity="0.92">
    <rect x="60"  y="205" width="26" height="55" rx="3" fill="url(#barGrad)" opacity="0.55"/>
    <rect x="96"  y="175" width="26" height="85" rx="3" fill="url(#barGrad)" opacity="0.7"/>
    <rect x="132" y="150" width="26" height="110" rx="3" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="168" y="120" width="26" height="140" rx="3" fill="url(#barGrad)"/>
    <rect x="204" y="190" width="26" height="70" rx="3" fill="url(#barGrad)" opacity="0.6"/>
  </g>

  <!-- Baseline -->
  <line x1="50" y1="260" x2="750" y2="260" stroke="#3a4552" stroke-width="1.5"/>

  <!-- Trend line with scatter dots -->
  <polyline points="60,240 130,190 210,205 290,150 370,170 450,110 530,130 610,80 690,95"
            fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <g fill="#7ee8db">
    <circle cx="60"  cy="240" r="5"/>
    <circle cx="130" cy="190" r="5"/>
    <circle cx="210" cy="205" r="5"/>
    <circle cx="290" cy="150" r="5"/>
    <circle cx="370" cy="170" r="5"/>
    <circle cx="450" cy="110" r="6"/>
    <circle cx="530" cy="130" r="5"/>
    <circle cx="610" cy="80"  r="6"/>
    <circle cx="690" cy="95"  r="5"/>
  </g>

  <!-- Scattered light points (upper right, "insight" motif) -->
  <g fill="#e8a33d" opacity="0.55">
    <circle cx="640" cy="55" r="3"/>
    <circle cx="700" cy="150" r="3"/>
    <circle cx="730" cy="60" r="2.5"/>
    <circle cx="580" cy="200" r="2.5"/>
  </g>

  <!-- Title block -->
  <text x="50" y="60" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#eef1f4" letter-spacing="1">
    Data Science Projects
  </text>
  <text x="50" y="88" font-family="'Courier New', monospace" font-size="15" fill="#9fb0bd" letter-spacing="0.5">
    Python · Pandas · NumPy · EDA · Visualization
  </text>

  <!-- Corner tag -->
  <rect x="700" y="20" width="80" height="28" rx="14" fill="#1a2530" stroke="#4fd1c5" stroke-width="1" opacity="0.9"/>
  <text x="740" y="38" font-family="'Courier New', monospace" font-size="12" fill="#7ee8db" text-anchor="middle">GitHub</text>
</svg>
